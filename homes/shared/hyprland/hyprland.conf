################
### HYPRLAND ###
################

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1, preferred, auto, 1.25
monitor = eDP-2, preferred, auto, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$emoji    = smile
$explorer = nautilus
$menu     = walker
$terminal = kitty


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = clipse -listen
exec-once = hyprpaper
exec-once = elephant
exec-once = hyprctl setcursor Nordzy-cursors 22
exec-once = walker --gapplication-service
exec-once = waybar
exec-once = wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ 1
exec-once = wpctl set-volume @DEFAULT_AUDIO_SINK@ 0
# exec-once = ~/.config/hypr/pywal.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = GDK_SCALE,2
env = HYPRCURSOR_SIZE,22
env = XCURSOR_SIZE,22

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(4c566aff)
    col.inactive_border = rgba(2e3440ff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4
        passes = 1
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    animate_manual_resizes = true # Fix resize window animation
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    force_default_wallpaper = 0   # Set to 0 or 1 to disable the anime mascot wallpapers
}

# https://wiki.hypr.land/Configuring/XWayland/#hidpi-xwayland
xwayland {
  force_zero_scaling = true
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = br
    kb_variant =
    kb_model = pc105

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    gesture = 3, horizontal, workspace
    workspace_swipe_touch = true
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_forever = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# App binds
bind = SUPER, A, exec, $menu
bind = SUPER, C, exec, $terminal --class clipse -e clipse
bind = SUPER, E, exec, $terminal --class superfile -e superfile
bind = SUPER, F, fullscreen
bind = SUPER, Q, killactive,
bind = SUPER, V, togglefloating
bind = SUPER, X, exec, $terminal
bind = SUPER, period, exec, $emoji

bind = SUPER, Delete, exit
bind = SUPER, Escape, exec, $terminal --class systemctl-tui -e systemctl-tui
bind = SUPER  SHIFT, C, exec, hyprpicker -aq
bind = SUPER  SHIFT, E, exec, $explorer
bind = SHIFT, Print, exec, grimblast --notify --freeze copy output
bind =      , Print, exec, grimblast --notify --freeze copy area


# Move focus with SUPER + arrow keys
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

# Move active window in a workspace with SUPER + SHIFT + arrow keys
bind = SUPER SHIFT, left,  movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up,    movewindow, u
bind = SUPER SHIFT, down,  movewindow, d

# Resize active window
binde = SUPER,       equal, resizeactive,  40   0
binde = SUPER,       minus, resizeactive, -40   0
binde = SUPER SHIFT, equal, resizeactive,   0  40
binde = SUPER SHIFT, minus, resizeactive,   0 -40

# Switch workspaces with SUPER + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Cycle through windows with Alt + Tab
bind = ALT, Tab , cyclenext

# Mange special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, Page_Up, movetoworkspace, special:magic
bind = SUPER SHIFT, Page_Down, movetoworkspace, previous

# Move/resize windows with SUPER + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizeactive

# Laptop multimedia keys for volume and LCD brightness
bind = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+      && source ~/.config/hypr/notify-volume-change.sh
bind = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-      && source ~/.config/hypr/notify-volume-change.sh
bind = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle   && source ~/.config/hypr/notify-volume-toggle.sh
bind = , XF86AudioMicMute,      exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle && source ~/.config/hypr/notify-microphone-toggle.sh
bind = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+ && source ~/.config/hypr/notify-brightness.sh
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && source ~/.config/hypr/notify-brightness.sh

# Requires playerctl
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = supress-maximize-events,
  match:class = .*
  suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
  name = xwayland-drag-fix
  match:class = ^$
  match:title = ^$
  match:float = true
  match:fullscreen = false
  match:pin = false
  match:xwayland = true
  no_focus = on
}

# Configure Clipse window
windowrule = match:class clipse, float true
windowrule = match:class clipse, move 60 560
windowrule = match:class clipse, pin true
windowrule = match:class clipse, size 440 300
windowrule = match:class clipse, stay_focused true
windowrule = match:class clipse, border_size 1

# Configure Smile window
windowrule = match:class (it.mijorus.smile), float true
windowrule = match:class (it.mijorus.smile), pin true
windowrule = match:class (it.mijorus.smile), border_size 1

# Configure Zen window
# windowrule = match:class zen, opacity 0.99 override

# Fix JetBrains IDEs focus
# https://github.com/hyprwm/Hyprland/issues/2412
windowrule = center true,   match:class jetbrains-.*, match:title splash, match:float true
windowrule = no_focus true, match:class jetbrains-.*, match:title splash, match:float true
windowrule = no_focus true, match:class jetbrains-.*, match:title win.*, match:float true
windowrule = no_blur true,  match:class jetbrains-.*, match:float true
windowrule = no_initial_focus true, match:class jetbrains-.*, match:float true
windowrule = opacity 1 override 1 override 1, match:class jetbrains-.*, match:float true
